<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>printcad — browser WASM demo</title>
  <link rel="stylesheet" href="style.css?v=20261020" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
</head>
<body>
  <header>
    <h1>printcad</h1>
    <p>Text → build123d → STEP. Runs entirely in your browser (Pyodide + OCP.wasm). Paste your own OpenRouter key.</p>
  </header>

  <section id="setup">
    <label>OpenRouter API key<br>
      <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" />
    </label>
    <label>Model<br>
      <input type="text" id="model" value="openrouter/free" />
    </label>
    <button id="initBtn">Initialize CAD engine</button>
    <span id="initStatus">Not loaded</span>
  </section>

  <section id="prompt-area">
    <label>Part description<br>
      <textarea id="prompt" rows="4" placeholder="FDM L-bracket 80x60 mm, 5 mm thick, two M4 clearance holes per leg"></textarea>
    </label>
    <button id="runBtn" disabled>Generate</button>
    <button id="editBtn" disabled>Second take</button>
  </section>

  <section id="ask-area" class="hidden">
    <h2>Clarifying questions</h2>
    <div id="askAssumptions" class="assumptions"></div>
    <form id="askForm"></form>
    <div class="ask-actions">
      <button type="button" id="askSubmit">Submit answers</button>
      <button type="button" id="askDefaults">Use defaults / skip</button>
    </div>
  </section>

  <section id="log-area">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>

  <section id="preview-area" class="hidden">
    <h2>Preview</h2>
    <div id="viewer"></div>
    <div id="downloads"></div>
    <details>
      <summary>model.py</summary>
      <pre id="modelCode"></pre>
    </details>
    <details>
      <summary>params.json</summary>
      <pre id="paramsJson"></pre>
    </details>
  </section>

  <script src="app.js?v=20261020-ask2"></script>
</body>
</html>
