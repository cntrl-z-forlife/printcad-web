[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printcad"
version = "0.2.9"
description = "CLI harness: text to build123d to STEP, with multi-provider LLM tools and iterative edits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "build123d>=0.8",
  "httpx>=0.27",
  "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["printcad*"]
